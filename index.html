  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.fillRect(px-14,py+6,28,8);
  ctx.fillStyle='#ff9a4a'; ctx.fillRect(px-7+e.face,py-4,5,5); ctx.fillRect(px+3+e.face,py-4,5,5);
  ctx.fillStyle='rgba(255,255,255,.10)'; ctx.fillRect(px-14,py-12,28,4);
}
function drawEye(px,py,e,hurt){
  if(drawMobSprite(px,py,e,hurt)) return;
  const gl=0.7+0.3*Math.sin(timeAcc*4+e.home.x);
  ctx.globalAlpha=0.28*gl; ctx.fillStyle=e.d.c; ctx.beginPath(); ctx.arc(px,py,20,0,7); ctx.fill(); ctx.globalAlpha=1;
  ctx.fillStyle=hurt?'#fff':e.d.c; ctx.beginPath(); ctx.arc(px,py,13,0,7); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(px,py,7,0,7); ctx.fill();
  ctx.fillStyle='#22140c';
  ctx.beginPath(); ctx.arc(px+Math.sin(timeAcc*1.3)*3, py+Math.cos(timeAcc)*2, 3.6,0,7); ctx.fill();
}

function drawPickups(){
  for(const p of pickups){
    const px=p.x-cam.x, py=p.y-cam.y;
    if(px<-40||px>VW+40||py<-40||py>VH+40) continue;
    if(p.life<5 && Math.floor(p.life*8)%2===0) continue;
    if(p.wp){                                     // 掉落的武器
      const st=wStats(p.wp), bob=Math.sin(timeAcc*3+p.x)*2;
      ctx.globalAlpha=0.28; ctx.fillStyle=st.top?st.top.c:'#ffd76a';
      ctx.beginPath(); ctx.arc(px,py+bob,14,0,7); ctx.fill(); ctx.globalAlpha=1;
      ctx.save(); ctx.translate(px,py+bob); ctx.rotate(-0.5+Math.sin(timeAcc*2+p.x)*0.14);
      ctx.fillStyle='#8a5a2b'; ctx.fillRect(-2,-2,4,15);
      ctx.fillStyle=st.b.c;
      ctx.beginPath(); ctx.moveTo(-9,-2); ctx.quadraticCurveTo(0,-12,9,-2);
      ctx.lineTo(6,0); ctx.quadraticCurveTo(0,-7,-6,0); ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.font=UI.fontB('micro'); ctx.textAlign='center';
      ctx.lineWidth=3; ctx.strokeStyle='rgba(6,8,14,.9)';
      ctx.strokeText(st.n, px, py-16); ctx.fillStyle='#ffe9a8'; ctx.fillText(st.n, px, py-16);
      continue;
    }
    const c=itemColor(p.key), ore=p.key.split(':')[0]==='ore';
    ctx.globalAlpha=0.25; ctx.fillStyle=c;
    ctx.beginPath(); ctx.arc(px,py+Math.sin(timeAcc*3+p.x)*1.5,10,0,7); ctx.fill(); ctx.globalAlpha=1;
    ctx.save(); ctx.translate(px,py+Math.sin(timeAcc*3+p.x)*1.5);
    if(ore){
      ctx.rotate(Math.sin(timeAcc*1.4+p.x)*0.25);
      ctx.fillStyle=c; ctx.beginPath();
      ctx.moveTo(0,-7); ctx.lineTo(6,-2); ctx.lineTo(4,6); ctx.lineTo(-4,6); ctx.lineTo(-6,-2); ctx.closePath(); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.45)'; ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(6,-2); ctx.lineTo(1,0); ctx.closePath(); ctx.fill();
    }else{
      ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(0,0,8,5.5,0,0,7); ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(-2,-1,4,2);
    }
    ctx.restore();
  }
}
function drawBombs(){
  for(const b of bombs){
    const px=b.x-cam.x, py=b.y-cam.y;
    ctx.fillStyle=Math.floor(b.t*14)%2?'#ff5a4a':'#2b2b33';
    ctx.beginPath(); ctx.arc(px,py,6,0,7); ctx.fill();
    ctx.strokeStyle='#c9a05a'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(px,py-6); ctx.quadraticCurveTo(px+6,py-12,px+2,py-16); ctx.stroke();
  }
}
function drawRope(){
  if(!ropePath||ropePath.length<2||player.floorN<=0) return;
  const pts=ropePath.map(p=>({x:p.x-cam.x,y:p.y-cam.y}));
  const taut=ropeLeft()<90;
  ctx.lineCap='round'; ctx.lineJoin='round';
  // 井口向上的一截（暗示连到地面）
  ctx.setLineDash([5,7]); ctx.strokeStyle='rgba(214,167,101,.42)'; ctx.lineWidth=2.6;
  ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); ctx.lineTo(pts[0].x,pts[0].y-70); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.lineWidth=5.5;
  ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y); ctx.stroke();
  ctx.strokeStyle=taut?'#ff9a5e':'#d6a765'; ctx.lineWidth=3.4;
  ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y); ctx.stroke();
  ctx.fillStyle='#8a5a2b'; ctx.fillRect(pts[0].x-11,pts[0].y-17,22,7); ctx.fillRect(pts[0].x-7,pts[0].y-11,14,11);
}
function drawPlayer(){
  const px=Math.round(player.x-cam.x), py=Math.round(player.y-cam.y);
  if(player.inv>0 && Math.floor(player.inv*14)%2===0 && player.hurtT<=0) return;
  const f=player.face;
  ctx.save(); ctx.translate(px,py);
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(0,15,11,3.6,0,0,7); ctx.fill();
  const bob = player.onGround&&Math.abs(player.vx)>20 ? Math.sin(timeAcc*16)*1.4 : 0;
  ctx.translate(0,bob);
  ctx.fillStyle='#33405e';
  const lw=Math.abs(player.vx)>20?Math.sin(timeAcc*15)*4:0;
  ctx.fillRect(-7+lw*0.4,4,6,10); ctx.fillRect(1-lw*0.4,4,6,10);
  ctx.fillStyle=player.hurtT>0?'#ff8a7a':'#4a6fa8'; ctx.fillRect(-9,-8,18,14);
  ctx.fillStyle='#3a5680'; ctx.fillRect(-9,2,18,3);
  ctx.fillStyle='#8a5a2b'; ctx.fillRect(-f*13,-7,7,11);
  ctx.fillStyle='#f0c9a0'; ctx.fillRect(-7,-20,14,13);
  ctx.fillStyle='#22303f'; ctx.fillRect(f>0?1:-5,-15,3,3);
  ctx.fillStyle='#e0a83a'; ctx.fillRect(-8,-23,16,5); ctx.fillRect(-8,-23,16,2);
  ctx.fillStyle='#ffd76a'; ctx.fillRect(f>0?2:-9,-24,7,3);
  const lg=0.7+0.3*Math.sin(timeAcc*4);
  ctx.fillStyle='rgba(255,236,160,'+(0.9*lg)+')'; ctx.beginPath(); ctx.arc(f>0?5:-5,-19,2.6,0,7); ctx.fill();
  if(player.swing>0) drawWeapon(f);
  ctx.restore();
}
function drawWeapon(f){
  const w=wpn();
  const dur=Math.max(0.001,w.cd*0.8);
  const t=1-player.swing/dur;
  const ang=(-1.2+2.6*Math.min(1,t*1.6))*f;
  ctx.save(); ctx.translate(f*9,-6); ctx.rotate(ang);
  ctx.fillStyle='#8a5a2b'; ctx.fillRect(-2,0,4,Math.max(16,w.range*0.28));
  if(w.top){ ctx.shadowColor=w.top.c; ctx.shadowBlur=7+w.tier*2; }
  if(w.bk==='pick'){
    ctx.fillStyle=w.top?w.top.c:'#b9c0cc';
    ctx.beginPath(); ctx.moveTo(-10,2); ctx.quadraticCurveTo(0,-9,10,2);
    ctx.lineTo(7,4); ctx.quadraticCurveTo(0,-4,-7,4); ctx.closePath(); ctx.fill();
  }else if(w.bk==='sword'){
    ctx.fillStyle=w.top?w.top.c:'#d8dee8';
    ctx.beginPath(); ctx.moveTo(-2,2); ctx.lineTo(2,2); ctx.lineTo(2,-16); ctx.lineTo(0,-20); ctx.lineTo(-2,-16); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#c9a05a'; ctx.fillRect(-6,1,12,3);
  }else if(w.bk==='hammer'){
    ctx.fillStyle=w.top?w.top.c:'#9aa0ad'; ctx.fillRect(-9,-6,18,12);
    ctx.fillStyle='#6f7684'; ctx.fillRect(-9,2,18,4);
  }else{
    ctx.fillStyle='#e0b48c'; ctx.fillRect(-5,-3,10,7);
  }
  ctx.shadowBlur=0;
  ctx.restore();
  // 挥击弧光：画的这条半椭圆边线，就是真实的攻击判定范围
  if(player.swing>0){
    const a=clamp(1-player.swing/dur,0,1);
    const s0 = f>0 ? -Math.PI/2 : Math.PI/2;          // 右半边 / 左半边
    const s1 = f>0 ?  Math.PI/2 : Math.PI*1.5;
    ctx.save();
    ctx.globalAlpha=(1-a)*(w.tier>=2?0.52:0.30);
    ctx.strokeStyle=w.top?w.top.c:'#ffe9a8'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(0,-6,w.range,w.range*0.75,0,s0,s1); ctx.stroke();
    ctx.restore(); ctx.globalAlpha=1;
  }
}
function drawParts(){
  for(const p of parts){
    const a=1-p.t/p.life; ctx.globalAlpha=a; ctx.fillStyle=p.c;
    ctx.fillRect(p.x-cam.x-p.r/2,p.y-cam.y-p.r/2,p.r,p.r);
  }
  ctx.globalAlpha=1;
}
function drawFloaters(){
  ctx.font=UI.fontB('num'); ctx.textAlign='center';
  for(const f of floaters){
    const a=1-f.t/f.life; ctx.globalAlpha=a; ctx.lineWidth=3; ctx.strokeStyle='rgba(6,8,14,.9)';
    ctx.strokeText(f.txt,f.x-cam.x,f.y-cam.y); ctx.fillStyle=f.col; ctx.fillText(f.txt,f.x-cam.x,f.y-cam.y);
  }
  ctx.globalAlpha=1;
}
function drawVignette(){
  if(player.floorN<=0) return;
  const d=clamp((player.floorN-1)/18,0,0.55);
  const g=ctx.createRadialGradient(player.x-cam.x,player.y-cam.y,120,player.x-cam.x,player.y-cam.y,520);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,'+(0.32+d)+')');
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  // 矿灯暖光
  ctx.save(); ctx.globalCompositeOperation='lighter';
  const R=118;
  const lg=ctx.createRadialGradient(player.x-cam.x,player.y-cam.y-4,0,player.x-cam.x,player.y-cam.y-4,R);
  lg.addColorStop(0,'rgba(255,226,150,.13)'); lg.addColorStop(1,'rgba(255,226,150,0)');
  ctx.fillStyle=lg; ctx.beginPath(); ctx.arc(player.x-cam.x,player.y-cam.y-4,R,0,7); ctx.fill();
  ctx.restore();
}
function label(txt,x,y,col){
  ctx.font=UI.font('body');
  ctx.textAlign='center'; ctx.lineWidth=3; ctx.strokeStyle='rgba(6,8,14,.9)';
  // 夹紧到画布内：地表最左/最右的建筑标签原来会被边缘切掉
  const cx=clamp(x, ctx.measureText(txt).width/2+8, VW-ctx.measureText(txt).width/2-8);
  ctx.strokeText(txt,cx,y); ctx.fillStyle=col; ctx.fillText(txt,cx,y);
}
function pillTxt(x,y,txt){
  ctx.font=UI.font('body');
  const w=ctx.measureText(txt).width+22;
  ctx.fillStyle='rgba(10,13,22,.86)'; roundRect(x-w/2,y-13,w,25,13); ctx.fill();
  ctx.strokeStyle='rgba(120,140,190,.45)'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle='#e6ecff'; ctx.textAlign='center'; ctx.fillText(txt,x,y+4);
}
function roundRect(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawHints(){
  if(state!=='play') return;
  ctx.textAlign='center';
  if(player.floorN===0){
    const p=nearPOI();
    if(p) pillTxt(p.tx*TILE+16-cam.x, 9*TILE-cam.y-120,
      p.kind==='crank' ? (crankCd>0?'碎石机冷却中…':'按住 E · 摇一次 +4~6 金') : '按 E · '+p.n);
    else if(Math.abs(player.x-(ENTRY_TX*TILE+16))<70) pillTxt(ENTRY_TX*TILE+16-cam.x, 9*TILE-cam.y-84, '按 S 下矿');
  }else{
    if(atHatch('down')) pillTxt(floor.exit.tx*TILE+16-cam.x, (floor.exit.ty+1)*TILE-cam.y-66,'按 S 下到下一层');
    else if(atHatch('up')) pillTxt(floor.entry.tx*TILE+16-cam.x,(floor.entry.ty+1)*TILE-cam.y-56,'按 W 爬回上一层');
    else if(player.returning) pillTxt(player.x-cam.x, player.y-cam.y-46,'返程中…');
  }
}

function updateHUD(){
  el.bHp.style.width=(clamp(player.hp/maxHp(),0,1)*100)+'%';
  el.tHp.textContent='生命 '+Math.max(0,Math.ceil(player.hp))+' / '+maxHp();
  if(player.floorN>0){
    const used=clamp(ropeLen/Math.max(1,ropeBudget()),0,1);
    el.bRope.style.width=(used*100)+'%';
    el.bRopeBox.classList.toggle('taut',ropeLeft()<90);
    el.tRope.textContent='绳索 '+Math.round(ropeLen)+' / '+Math.round(ropeBudget())
      +' · 剩 '+Math.max(0,Math.round(ropeLeft()));
  }else{
    el.bRope.style.width=(clamp(ropeLen/Math.max(1,ropeCap()),0,1)*100)+'%';
    el.bRopeBox.classList.remove('taut');
    el.tRope.textContent='绳索 '+ropeCap()+' · 可下潜 '+maxFloor()+' 层';
  }
  // Boss 血条（DOM）：有存活 Boss 才显示，位置与 toast 完全不重叠
  const boss = floor ? floor.ents.find(e=>e.boss&&!e.dead) : null;
  if(boss){
    el.bossBar.hidden=false;
    el.bossBar.classList.toggle('final', !!boss.final);
    el.bbName.textContent=boss.d.n;
    el.bbNum.textContent=Math.max(0,Math.ceil(boss.hp))+' / '+boss.max;
    el.bbFill.style.width=(clamp(boss.hp/boss.max,0,1)*100)+'%';
  }else if(!el.bossBar.hidden) el.bossBar.hidden=true;

  const bc=bagCount(), bcap=bagCap();
  el.bBag.style.width=clamp(bc/bcap,0,1)*100+'%';
  el.tBag.textContent='背包 '+bc+' / '+bcap;
  el.gold.textContent='金币 '+G.gold;
  el.depth.textContent = player.floorN>0 ? ('第 '+player.floorN+' 层 · '+floor.theme.n) : '地表';
  const w=wpn();
  el.items.textContent='武器 '+w.n+'（价值 '+(G.wp?G.wp.v:0)+'） 伤害 '+Math.round(w.dmg*dmgMul())
    +' · 信标 '+G.beaconItems+' · 炸药 '+G.bombs+' · 药水 '+G.potions;
  let h;
  if(player.floorN>0)
    h='<kbd>A</kbd><kbd>D</kbd> 移动/转向 · <kbd>空格</kbd> 跳 · <kbd>W</kbd><kbd>S</kbd> 爬梯/上下层 · <kbd>J</kbd>/<kbd>左键</kbd> 朝面向半边·范围攻击 · <kbd>长按R</kbd> 返回地面 · <kbd>F</kbd> 炸药 · <kbd>Q</kbd> 药水 · <kbd>B</kbd> 放信标';
  else
    h='<kbd>A</kbd><kbd>D</kbd> 移动 · 走到 <kbd>商店</kbd>/<kbd>赌场</kbd>/<kbd>工坊</kbd>/<kbd>传送柱</kbd> 按 <kbd>E</kbd> · <kbd>碎石机</kbd> 按住 <kbd>E</kbd> 摇钱 · 洞口按 <kbd>S</kbd> 下矿 · <kbd>M</kbd> 静音';
  if(el.bot.dataset.h!==h){ el.bot.innerHTML=h; el.bot.dataset.h=h; }
  if(touchUI){
    const p = player.floorN===0 ? nearPOI() : null;
    if(el.tE) el.tE.classList.toggle('ready', !!p && p.kind!=='crank');
    if(el.tB) el.tB.classList.toggle('ready', player.floorN>0 && G.beaconItems>0);
    if(el.tQ) el.tQ.classList.toggle('ready', G.potions>0);
    if(el.tF) el.tF.classList.toggle('ready', G.bombs>0);
    if(el.tR) el.tR.classList.toggle('ready', player.floorN>0);
    if(el.tM) el.tM.classList.toggle('off', muted);
  }
}
function toast(msg,kind){
  const d=document.createElement('div');
  d.className='tst'+(kind?' '+kind:''); d.textContent=msg;
  el.toast.appendChild(d);
  setTimeout(()=>{ d.style.transition='opacity .3s'; d.style.opacity='0'; setTimeout(()=>d.remove(),320); },1750);
  while(el.toast.children.length>4) el.toast.firstChild.remove();
}

  if(code!=='Space'&&code!=='Enter'&&code!=='NumpadEnter') return false;

  if(tut&&tut.classList.contains('on')){ hideTutorial(); return true; }

function wpPanelHtml(w, extraBtn, on){
  const st=wStats(w);
  const chips = st.tiers.length
    ? st.tiers.map(t=>'<span class="wchip" style="background:'+t.c+'22;color:'+t.c+'">'+t.n+' · '+t.d+'</span>').join('')
    : '<span class="wchip">尚未跨过任何挡位</span>';
  return '<div class="item'+(on?' on':'')+'">'
    + '<div class="ic" style="background:'+(w.v>=900?'#f5c542':st.b.c)+'">'+st.b.n[0]+'</div>'
    + '<div class="tx"><div class="n">'+st.n+' <span class="tag">价值 '+w.v+'</span></div>'
    +   '<div class="d">'+st.b.d+'</div>'
    +   '<div class="wstat">伤害 <b>'+Math.round(st.dmg*dmgMul())+'</b>（'+st.b.dmg+' + 价值 '+w.v+' × 0.16）'
    +   ' · 距离 <b>'+Math.round(st.range)+'</b> · 间隔 <b>'+st.cd.toFixed(2)+'s</b>'
    +   (st.next ? ' · 再攒 <b>'+(st.next.v-w.v)+'</b> 价值解锁「'+st.next.n+'」' : ' · 已满档')
    +   '<br>'+AOE_HINT
    +   (st.fx.indexOf('cleave')>=0?'（已贯穿：无衰减）':'')+'</div>'
    + '<div class="wrow">'+chips+'</div></div>' + extraBtn + '</div>';
}
function openShop(){
  const rows=SHOP.map(s=>`<div class="item">
    <div class="ic" style="background:${s.c}">${s.n[0]}</div>
    <div class="tx"><div class="n">${s.n}</div><div class="d">${s.d}</div><div class="v">${s.p} 金币</div></div>
    <button class="buy" onclick="buyItem('${s.id}',${s.p})" ${G.gold<s.p?'disabled':''}>购买</button></div>`).join('');

  // 商店只卖最基础的一档：固定价、固定价值
  const brows=WBASE.filter(w=>w.k!=='fist').map(w=>{
    const st=wStats({b:w.k, v:BASE_WP_VAL});
    return `<div class="item">
      <div class="ic" style="background:${w.c}">${w.n[0]}</div>
      <div class="tx"><div class="n">基础${w.n} <span class="tag">价值 ${BASE_WP_VAL}</span></div>
        <div class="d">${w.d} · 想变强就把它押进赌场翻倍</div>
        <div class="wstat">伤害 <b>${Math.round(st.dmg*dmgMul())}</b> · 距离 <b>${st.range}</b> · 间隔 <b>${st.cd}s</b><br>${AOE_HINT}</div></div>
      <button class="buy" onclick="buyBaseWp('${w.k}')" ${G.gold<BASE_WP_PRICE?'disabled':''}>${BASE_WP_PRICE} 金币</button></div>`;
  }).join('');

  const own=[];
  if(G.wp) own.push({i:-1, w:G.wp, on:true});
  G.wpStock.forEach((w,i)=>own.push({i, w, on:false}));
  const orows = own.length ? own.map(o=>{
    const btn = o.on
      ? '<button class="buy" onclick="sellWp(-1)" '+(G.wp.v>0?'':'disabled')+'>卖出 '+G.wp.v+' 金</button>'
      : '<button class="equip" onclick="equipWp('+o.i+')">装备</button>'
       +'<button class="buy" onclick="sellWp('+o.i+')">卖 '+o.w.v+'</button>';
    return wpPanelHtml(o.w, btn, o.on);
  }).join('')
   : '<div class="sub">你身上没有任何武器 —— '+(G.gold>=BASE_WP_PRICE?'先买一把基础镐。':'钱不够就去旁边的碎石机摇一阵。')+'</div>';

  openPanel(`<h2>杂货商店</h2>
    <div class="sub">补给品在深层能救命。武器永远只卖最基础的那一档 —— 想变强，去赌场把价值翻上去。</div>
    <div class="grid">${rows}</div>
    <h2 style="margin-top:20px;font-size:17px">基础武器 · 统一 ${BASE_WP_PRICE} 金币</h2>
    <div class="sub">价值固定 ${BASE_WP_VAL}。伤害 = 底子 + 价值 × 0.16；价值每跨一个挡位，多一项距离或特效加成。</div>
    <div class="grid">${brows}</div>
    <h2 style="margin-top:20px;font-size:17px">我持有的武器</h2>
    <div class="sub">宝箱会开出随机价值的武器。不想要的可以直接按价值卖给商店。</div>
    ${orows}
    <div class="foot"><span class="pill">持有：<b>${G.gold}</b> 金币</span>
      <button class="ghost" onclick="closePanel()">离开商店 (Esc)</button></div>`);
}
function buyItem(id,p){
  if(G.gold<p){ S.no(); return; }
  G.gold-=p; S.coin();
  if(id==='beacon') G.beaconItems++; if(id==='bomb') G.bombs++; if(id==='potion') G.potions++;
  save(); openShop();
}
function buyBaseWp(k){
  if(G.gold<BASE_WP_PRICE){ S.no(); return; }
  G.gold-=BASE_WP_PRICE;
  if(G.wp) G.wpStock.push(G.wp);                 // 旧武器进库存，不会凭空蒸发
  G.wp={b:k, v:BASE_WP_VAL};
  S.coin(); toast('买下基础'+wBase(G.wp).n+'（价值 '+BASE_WP_VAL+'）','good');
  save(); openShop();
}
function equipWp(i){
  const w=G.wpStock[i]; if(!w) return;
  G.wpStock.splice(i,1);
  if(G.wp) G.wpStock.push(G.wp);
  G.wp=w; S.coin(); toast('已装备 '+wStats(w).n,'good'); save(); openShop();
}
function sellWp(i){
  const w=(i<0)?G.wp:G.wpStock[i]; if(!w) return;
  if(w.v<=0){ S.no(); return; }
  G.gold+=w.v; G.st.earned+=w.v; S.coin();
  toast('卖出 '+wStats(w).n+'，+'+w.v+' 金','gold');
  if(i<0) G.wp=null; else G.wpStock.splice(i,1);
  save(); openShop();
}

/* =========================================================================
   赌场 · 红与黑 —— 金币 / 战利品 / 武器，猜中翻倍，猜错清零
   ========================================================================= */
function stakeDesc(){
  const s=casino.stake; if(!s) return null;
  if(s.type==='gold')
    return {txt:'金币 '+s.amt, win:'猜中 → '+s.amt*2+' 金（净赚 '+s.amt+'）',
            lose:'猜错 → 这 '+s.amt+' 金清零', ok:s.amt>0&&G.gold>=s.amt};
  if(s.type==='item'){
    const have=G.bag[s.key]||0, n=Math.max(0,Math.min(s.cnt,have));
    return {txt:itemName(s.key)+' × '+n, win:'猜中 → 变成 '+(have+n)+' 个（净赚 '+n+'）',
            lose:'猜错 → 这 '+n+' 个清零', ok:n>0};
  }
  const w=(s.idx<0)?G.wp:G.wpStock[s.idx];
  if(!w) return null;
  return {txt:wStats(w).n+'（价值 '+w.v+'）',
          win:'猜中 → 价值翻倍到 '+Math.round(w.v*2),
          lose:'猜错 → 武器碎裂，价值清零', ok:true};
}
function applyGamble(win){
  const s=casino.stake; if(!s) return;
  if(s.type==='gold'){
    if(win){ G.gold+=s.amt; G.st.earned+=s.amt; } else G.gold=Math.max(0,G.gold-s.amt);
  }else if(s.type==='item'){
    const have=G.bag[s.key]||0, n=Math.max(0,Math.min(s.cnt,have));
    if(win) G.bag[s.key]=have+n;
    else { const left=have-n; if(left>0) G.bag[s.key]=left; else delete G.bag[s.key]; }
  }else{
    const w=(s.idx<0)?G.wp:G.wpStock[s.idx]; if(!w) return;
    if(win) w.v=Math.round(w.v*2);
    else if(s.idx<0) G.wp=null;                // 装备中的碎了就只剩拳头
    else G.wpStock.splice(s.idx,1);
  }
  const d=stakeDesc();
  if(!d||!d.ok) casino.stake=null;             // 赌注已经没了，撤下赌桌
}
function cTab(t){ casino.tab=t; casino.msg=null; casino.card=null; openCasino(); }
function clearStake(){ casino.stake=null; casino.msg=null; casino.card=null; openCasino(); }
function setStakeGold(a){
  a=Math.floor(Math.max(0,Math.min(G.gold,a)));
  if(a<=0){ S.no(); return; }
  casino.stake={type:'gold', amt:a}; casino.msg=null; casino.card=null; openCasino();
}
function setStakeItem(k,n){
  const have=G.bag[k]||0; if(have<=0){ S.no(); return; }
  casino.stake={type:'item', key:k, cnt:Math.max(1,Math.min(have,n))};
  casino.msg=null; casino.card=null; openCasino();
}
function setStakeWp(i){
  const w=(i<0)?G.wp:G.wpStock[i]; if(!w){ S.no(); return; }
  casino.stake={type:'wp', idx:i}; casino.msg=null; casino.card=null; openCasino();
}
function stepStake(d){
  const s=casino.stake; if(!s||s.type!=='item') return;
  const have=G.bag[s.key]||0;
  s.cnt = d>100 ? have : Math.max(1, Math.min(have, s.cnt+d));
  openCasino();
}
function gamble(guess){
  const d=stakeDesc();
  if(casino.busy||!d||!d.ok){ S.no(); return; }
  casino.busy=true; casino.msg=null; casino.card=null; casino.seq++;
  const seq=casino.seq;
  S.tp(); openCasino();
  setTimeout(()=>{
    if(state!=='panel'||casino.seq!==seq) return;        // 期间离开赌桌就算弃局
    const card=Math.random()<0.5?'red':'black';
    const win=(card===guess);
    casino.busy=false; casino.card=card; casino.win=win;
    if(win){ G.st.gwin++; casino.msg='你赢了 —— 赌注翻倍'; S.coin(); }
    else   { G.st.glose++; casino.msg='你输了 —— 赌注清零'; S.no(); }
    applyGamble(win);
    openCasino(); save();
  },820);
}
function openCasino(){
  const d=stakeDesc();
  let card;
  if(!d) card='<div class="cstake"><div class="lab">赌 桌</div>'
    +'<div class="val" style="color:var(--dim);font-size:15px">还没有押上任何东西</div>'
    +'<div class="win" style="color:var(--dim)">在下面选一样押上，再猜红黑</div></div>';
  else card='<div class="cstake"><div class="lab">赌 桌</div>'
    +'<div class="val">'+d.txt+'</div>'
    +'<div class="win">'+d.win+'</div><div class="lose">'+d.lose+'</div>'
    +(casino.stake.type==='item'
      ? '<div class="cquick"><button onclick="stepStake(-1)">− 1</button>'
        +'<button onclick="stepStake(1)">+ 1</button>'
        +'<button onclick="stepStake(9999)">全押</button></div>' : '')
    +'<div class="cquick"><button onclick="clearStake()">收回赌注</button></div></div>';

  const tabs='<div class="ctabs">'
    +'<div class="ctab'+(casino.tab==='gold'?' on':'')+'" onclick="cTab(\'gold\')">押金币</div>'
    +'<div class="ctab'+(casino.tab==='item'?' on':'')+'" onclick="cTab(\'item\')">押战利品</div>'
    +'<div class="ctab'+(casino.tab==='wp'?' on':'')+'" onclick="cTab(\'wp\')">押武器</div></div>';

  let body='';
  if(casino.tab==='gold'){
    body='<div class="cquick">'
      +'<button onclick="setStakeGold(50)">50</button>'
      +'<button onclick="setStakeGold(200)">200</button>'
      +'<button onclick="setStakeGold(1000)">1000</button>'
      +'<button onclick="setStakeGold(Math.floor(G.gold/2))">一半</button>'
      +'<button onclick="setStakeGold(G.gold)">全部</button></div>'
      +'<div class="sub" style="margin-top:12px">持有 <b style="color:var(--gold)">'+G.gold+'</b> 金币 · '
      +(G.gold>0?'点上面的按钮把金币放上赌桌。':'身无分文 —— 洞口旁边的碎石机可以慢慢摇钱。')+'</div>';
  }else if(casino.tab==='item'){
    const ks=Object.keys(G.bag).filter(k=>(G.bag[k]||0)>0).sort((a,b)=>valueOf(b)-valueOf(a));
    body = ks.length ? ks.map(k=>{
      const have=G.bag[k], sel=casino.stake&&casino.stake.type==='item'&&casino.stake.key===k;
      return '<div class="cpick'+(sel?' on':'')+'">'
        +'<div class="nm"><span style="color:'+itemColor(k)+'">■</span> '+itemName(k)
        +'<small>持有 '+have+' · 单价 '+valueOf(k)+' 金 · 合计折值 '+(valueOf(k)*have)+' 金</small></div>'
        +'<button class="ghost" onclick="setStakeItem(\''+k+'\',1)">押 1</button>'
        +'<button class="'+(sel?'equip':'ghost')+'" onclick="setStakeItem(\''+k+'\','+have+')">全押 '+have+'</button>'
        +'</div>';
    }).join('') : '<div class="sub">背包空空 —— 先下矿砸点晶簇背回来。</div>';
  }else{
    const list=[];
    if(G.wp) list.push({i:-1, w:G.wp, on:true});
    G.wpStock.forEach((w,i)=>list.push({i, w, on:false}));
    body = list.length ? list.map(o=>{
      const st=wStats(o.w), sel=casino.stake&&casino.stake.type==='wp'&&casino.stake.idx===o.i;
      return '<div class="cpick'+(sel?' on':'')+'">'
        +'<div class="nm">'+st.n+' '+(o.on?'<span class="tag">已装备</span>':'')
        +'<small>价值 '+o.w.v+' · 伤害 '+Math.round(st.dmg*dmgMul())+' · 距离 '+Math.round(st.range)
        +' · 间隔 '+st.cd.toFixed(2)+'s'
        +(st.next?' · 下一档「'+st.next.n+'」还差 '+(st.next.v-o.w.v):'')+'</small></div>'
        +'<button class="'+(sel?'equip':'ghost')+'" onclick="setStakeWp('+o.i+')">'+(sel?'已押上':'押上')+'</button></div>';
    }).join('') : '<div class="sub">手上没有武器 —— 商店里 '+BASE_WP_PRICE+' 金币就能买一把基础的。</div>';
  }

  let res='';
  if(casino.msg) res='<div class="cflip '+casino.card+'">'+(casino.card==='red'?'红':'黑')+'</div>'
                    +'<div class="cmsg '+(casino.win?'win':'lose')+'">'+casino.msg+'</div>';
  else if(casino.busy) res='<div class="cflip wait">发牌中…</div>'
                          +'<div class="cmsg" style="color:var(--dim)">庄家正在翻牌</div>';

  const dis=(!d||!d.ok||casino.busy)?'disabled':'';
  openPanel('<h2>赌场 · 红与黑</h2>'
    +'<div class="sub">五五开。猜中翻倍，猜错清零 —— 金币、战利品、武器都能押。庄家不抽水，也不负责。</div>'
    +card+tabs+body+res
    +'<div class="cgo"><button class="red" onclick="gamble(\'red\')" '+dis+'>猜 红</button>'
    +'<button class="blk" onclick="gamble(\'black\')" '+dis+'>猜 黑</button></div>'
    +'<div class="foot"><span class="pill">持有：<b>'+G.gold+'</b> 金币 · 战绩 <b>'+G.st.gwin+'</b> 胜 / <b>'+G.st.glose+'</b> 负</span>'
    +'<button class="ghost" onclick="closePanel()">离开赌场 (Esc)</button></div>');
}
function openUpgrade(){
  const cols=['#e8c07a','#b9c0cc','#7fd2ff','#ff7a6e','#8ad2a0','#c98aff'];
  const rows=UP.map((u,i)=>{
    const lv=G.up[u.k], maxed=lv>=u.max, price=upPrice(u);
    return `<div class="item">
      <div class="ic" style="background:${cols[i]}">${u.n[0]}</div>
      <div class="tx"><div class="n">${u.n} <span class="tag">Lv.${lv}${maxed?' 满级':''}</span></div>
        <div class="d">${u.d}</div>
        <div class="v">${maxed?'已达最高等级':('Lv.'+(lv+1)+' → '+u.f(lv+1)+' · '+price+' 金币')}</div></div>
      ${maxed?'<button class="buy" disabled>满级</button>'
        :`<button class="buy" onclick="buyUp('${u.k}',${price})" ${G.gold<price?'disabled':''}>升级</button>`}</div>`;
  }).join('');
  openPanel(`<h2>装备工坊</h2>
    <div class="sub">层数越深越值钱 —— 前期先升登山绳和背包最划算。</div>
    <div class="grid">${rows}</div>
    <div class="foot"><span class="pill">持有：<b>${G.gold}</b> 金币</span>
      <button class="ghost" onclick="closePanel()">离开工坊 (Esc)</button></div>`);
}
function buyUp(k,price){
  const u=UP.find(x=>x.k===k);
  if(G.up[k]>=u.max||G.gold<price){ S.no(); return; }
  G.gold-=price; G.up[k]++; S.coin();
  if(k==='hp') player.hp=maxHp();
  toast(u.n+' 升级到 Lv.'+G.up[k],'good');
  save(); openUpgrade();
}
function openPortal(){
  if(!G.beacons.length){
    openPanel(`<h2>传送石柱</h2><div class="sub">你还没有放置任何信标。</div>
      <div class="item"><div class="ic" style="background:#58b6f0">?</div>
      <div class="tx"><div class="n">如何使用</div>
      <div class="d">商店买「传送信标」→ 下矿后按 <b>B</b> 就地放置 → 之后从这里一键直达那一层</div></div></div>
      <div class="foot"><span class="pill">信标存货：<b>${G.beaconItems}</b></span>
      <button class="ghost" onclick="closePanel()">关闭 (Esc)</button></div>`);
    return;
  }
  const rows=G.beacons.map((b,i)=>{
    const need=(b.f-1)*FLOOR_COST;
    const ok = need+120 <= ropeCap();
    return `<div class="lrow">
      <div class="k">${b.name} <small>第 ${b.f} 层 · 需要绳索 ${need} / ${ropeCap()}</small></div>
      <button class="buy" onclick="teleport(${i})" ${ok?'':'disabled'}>${ok?'传送':'绳索不够'}</button></div>`;
  }).join('');
  openPanel(`<h2>传送石柱</h2>
    <div class="sub">选择要直达的信标。绳索长度不足时无法传送。</div>
    <div class="listwrap">${rows}</div>
    <div class="foot"><span class="pill">信标存货：<b>${G.beaconItems}</b> · 已放置 <b>${G.beacons.length}</b>/8</span>
    <button class="ghost" onclick="closePanel()">关闭 (Esc)</button></div>`);
}
function teleport(i){
  const b=G.beacons[i]; if(!b) return;
  closePanel();
  transition(()=>{
    enterFloor(b.f,false);
    player.x=b.tx*TILE+16; player.y=b.ty*TILE+16;
    player.vx=player.vy=0; ropeDirty=true; lastRope={x:player.x,y:player.y}; lastTile='';
    computeRope();
    cam.x=clamp(player.x-VW/2,0,floor.w*TILE-VW);
    cam.y=clamp(player.y-VH/2+30,0,Math.max(0,floor.h*TILE-VH));
    S.tp(); burst(player.x,player.y,'#7fd9ff',24);
    toast('已传送至第 '+b.f+' 层','gold');
  });
  save();
}

      <span><button onclick="closePanel()">返回游戏 (Esc)</button>
      <button class="ghost" onclick="openSettings()">设置</button>
      <button class="ghost" onclick="openRelics()">遗物圣坛</button>
      <button class="ghost" onclick="openStats()">战绩</button>
      <button class="ghost" onclick="toggleTouch()">触屏按键：${touchUI?'开':'关'}</button>
      <button class="ghost" onclick="hardReset()">重新开始</button></span>
    </div>`);
}
function hardReset(){
  if(!confirm('确定要清空存档、重新开始吗？')) return;
  localStorage.removeItem('deepcave2_save');
  newGame((Math.random()*1e9)|0); save(); closePanel(); toast('新的矿洞已生成','good');
}

/* =========================================================================
   存档
   ========================================================================= */
const SAVE_KEY='deepcave2_save';
function save(){
  if(!G) return;
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({
    seed:G.seed, gold:G.gold, wp:G.wp, wpStock:G.wpStock,
    up:G.up, bag:G.bag, beaconItems:G.beaconItems, beacons:G.beacons,
    potions:G.potions, bombs:G.bombs, st:G.st,
    relics:G.relics||{}, rp:G.rp||0 })); }catch(e){}
}
function load(){
  try{
    const s=localStorage.getItem(SAVE_KEY); if(!s) return false;
    const d=JSON.parse(s);
    G={ seed:d.seed>>>0, gold:d.gold||0,
        // 老存档迁移：原来只有 weapon 字符串，转成 {底子, 价值} 实例
        wp:(d.wp&&d.wp.b)?d.wp:{b:d.weapon||'pick', v:BASE_WP_VAL},
        wpStock:Array.isArray(d.wpStock)?d.wpStock.filter(w=>w&&w.b):[],
        up:Object.assign({rope:1,forge:1,bag:1,hp:1,boots:1,eye:1},d.up||{}),
        bag:d.bag||{}, beaconItems:d.beaconItems||0, beacons:d.beacons||[],
        potions:d.potions||0, bombs:d.bombs||0,
        relics:d.relics||{}, rp:d.rp||0,
        st:Object.assign({deaths:0,deepest:0,earned:0,kills:0,runs:0,floors:0,gwin:0,glose:0,
                          bosses:0,won:false,milestone:0},d.st||{}) };
    relicInit();                             // 老存档迁移：补 relics/rp/milestone
    floorCache=new Map(); enterFloor(0,true);
    player.hp=maxHp();
    return true;
  }catch(e){ return false; }
}

/* =========================================================================
   主循环
   ========================================================================= */
let state='menu', lastT=performance.now();
function frame(now){
  let dt=(now-lastT)/1000; lastT=now; dt=Math.min(dt,1/30);
  if(state==='play'&&!fading){
    const wdt=consumeHitStop(dt);            // 打击停顿：世界时间被压缩，渲染不受影响
    timeAcc+=wdt;
    crankCd=Math.max(0,crankCd-wdt);
    crankSpin+=(crankCd/CRANK_CD)*15*wdt;
    if(keys.KeyE && player.floorN===0){ const cp=nearPOI(); if(cp&&cp.kind==='crank') crank(); }
    updatePlayer(wdt);
    if(floor&&floor.ents) updateEntities(wdt);
    updatePickups(wdt); updateBombs(wdt); updateFx(wdt);
    cam.shake=Math.max(0,cam.shake-dt*34);
    const tx=clamp(player.x-VW/2,0,Math.max(0,floor.w*TILE-VW));
    const ty=clamp(player.y-VH/2+30,0,Math.max(0,floor.h*TILE-VH));
    cam.x=lerp(cam.x,tx,Math.min(1,dt*8)); cam.y=lerp(cam.y,ty,Math.min(1,dt*7));
    saveTimer+=dt; if(saveTimer>20){ saveTimer=0; if(player.floorN===0) save(); }
  }else{
    cam.shake=Math.max(0,cam.shake-dt*34);
    updateFx(Math.min(dt,0.016));
  }
  ctx.save();
  const sh = reduceFx ? 0 : cam.shake*shakeMul;      // 减少动态效果 / 震动强度
  if(sh>0.2) ctx.translate((Math.random()-0.5)*sh,(Math.random()-0.5)*sh);
  render();
  ctx.restore();
  if(G) updateHUD();
  requestAnimationFrame(frame);
}

   ========================================================================= */

function cont(){ if(!load()){ fresh(); return; } closePanel(); toast('欢迎回来，矿工','good'); }

  const isNew = !tutorialSeen();
  newGame((Math.random()*1e9)|0); save(); closePanel();
  toast('新的矿洞已生成，去商店看看','good');
  if(isNew) showTutorial();                 // 首次进入才提示，且不改 state（不阻断游戏）
}
window.cont=cont; window.fresh=fresh; window.closePanel=closePanel;

requestAnimationFrame(frame);
